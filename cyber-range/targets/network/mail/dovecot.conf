# =============================================================================
# Dovecot — Deliberately Insecure Configuration
# =============================================================================
# DMZ-26: Cleartext authentication (no SSL required)
# DMZ-27: Weak user credentials
# DMZ-28: IMAP IDLE enabled (information disclosure)

# Listen on all interfaces
listen = *

# Protocols
protocols = imap pop3

# DMZ-26: Disable SSL entirely — cleartext auth
ssl = no

# Authentication — plain text
auth_mechanisms = plain login

# DMZ-28: IMAP IDLE — enabled by default, leaks real-time info
# (Dovecot enables IDLE by default)

# User database — system users
passdb {
    driver = pam
}
userdb {
    driver = passwd
}

# Mail location
mail_location = maildir:~/Maildir

# Logging
log_path = /dev/stderr
info_log_path = /dev/stderr

# Allow plaintext auth on non-SSL connections (ssl=no above handles this)
disable_plaintext_auth = no

# Disable login greeting version (still discoverable via other means)
login_greeting = Dovecot ready.
