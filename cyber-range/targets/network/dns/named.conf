// =============================================================================
// Deliberately Misconfigured BIND9 — Cyber Range Tier 1 (DMZ)
// =============================================================================
// DO NOT deploy outside the cyber-range. Every flaw is intentional.
//
// Vulnerabilities:
//   DMZ-31  Zone transfer (AXFR) allowed to any
//   DMZ-32  Open recursive resolver
//   DMZ-33  DNS cache poisoning (TXID prediction — BIND 9.18 default)
//   DMZ-34  Version disclosure (version.bind)
//   DMZ-35  Dynamic update zone allowed (no key required)
//   DMZ-36  Internal hostname leakage in zone records
// =============================================================================

options {
    directory "/tmp";

    // DMZ-32: Open recursive resolver — answers queries for any domain
    recursion yes;
    allow-recursion { any; };

    // DMZ-34: Version disclosure — exposes BIND version
    version "BIND 9.18.0";

    // DMZ-31: Allow zone transfers to anyone
    allow-transfer { any; };

    // DMZ-35: Allow dynamic updates from anyone
    allow-update { any; };

    // Listen on all interfaces
    listen-on { any; };
    listen-on-v6 { any; };

    // Disable DNSSEC for cache poisoning surface (DMZ-33)
    dnssec-validation no;
};

// Internal zone — leaks hostnames (DMZ-36)
zone "psyche.local" IN {
    type master;
    file "/etc/bind/zones/psyche.local.zone";
    allow-transfer { any; };  // DMZ-31
    allow-update { any; };    // DMZ-35
};

// Reverse DNS zone
zone "28.172.in-addr.arpa" IN {
    type master;
    file "/etc/bind/zones/172.28.rev";
    allow-transfer { any; };
};

// DMZ-34: version.bind disclosure is handled by the "version" directive
// in the options block above. No separate CHAOS zone needed —
// dig @target version.bind chaos txt will return "BIND 9.18.0".
