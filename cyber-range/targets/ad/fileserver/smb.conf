# =============================================================================
# Samba Configuration — FILESERVER01 (Deliberately Insecure)
# =============================================================================
# AD-17: SMBv1 enabled, AD-15: guest access, AD-11: signing disabled

[global]
    workgroup = PSYCHE
    realm = PSYCHE.LOCAL
    server string = FILESERVER01
    security = user
    map to guest = Bad User
    # AD-17: Enable SMBv1 (EternalBlue surface)
    server min protocol = NT1
    client min protocol = NT1
    # AD-11/AD-19: SMB signing disabled
    server signing = disabled
    client signing = disabled
    # Guest access
    guest account = nobody
    # Disable encrypted passwords check for null sessions
    null passwords = yes
    # Log level
    log level = 1
    log file = /var/log/samba/%m.log

# AD-15: Public share — no authentication required
[public]
    path = /srv/shares/public
    browseable = yes
    guest ok = yes
    read only = no
    create mask = 0777
    directory mask = 0777
    comment = Public Share - No Auth Required

# Finance share — weak permissions
[finance]
    path = /srv/shares/finance
    browseable = yes
    guest ok = no
    read only = yes
    valid users = localadmin, jsmith, svc_backup
    comment = Finance Department

# IT share — has SSH keys and configs
[it]
    path = /srv/shares/it
    browseable = yes
    guest ok = no
    read only = no
    valid users = localadmin, jsmith
    comment = IT Department

# AD-18: Writable SYSVOL share
[sysvol]
    path = /srv/shares/sysvol
    browseable = yes
    guest ok = yes
    read only = no
    comment = SYSVOL - Writable (AD-18)

# AD-21: Admin share — SAM access
[admin$]
    path = /var/lib/samba
    browseable = no
    guest ok = no
    read only = yes
    valid users = localadmin
    comment = Administrative Share
